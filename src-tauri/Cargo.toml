[package]
name = "live-studio"
version = "0.1.0"
description = "LIVE STUDIO — quản lý nội dung và live đa nền tảng"
edition = "2021"
rust-version = "1.77"

[lib]
name = "live_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
# WebSocket client for Euler Stream. native-tls = SChannel (Windows) / Secure Transport (macOS):
# no extra build tools needed on either OS.
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util", "sync"] }
# HTTPS client for the AI providers (same native-tls choice as above).
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
base64 = "0.22"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
url = "2"
# Random secret for the phone-sharing link.
getrandom = "0.2"
# Reads/writes the 7-ELEVEN order-import template (an .xlsx is a zip of XML files).
zip = { version = "2", default-features = false, features = ["deflate"] }

# OS secret stores (Keychain on macOS, Credential Manager on Windows). Linux is for development only.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
