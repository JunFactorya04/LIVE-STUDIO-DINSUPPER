[package]
name = "live-studio"
version = "0.1.0"
description = "LIVE STUDIO — quản lý nội dung và live đa nền tảng"
edition = "2021"
rust-version = "1.77"

[lib]
name = "live_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
