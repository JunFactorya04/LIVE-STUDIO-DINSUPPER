name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: npm ci

      - name: Check (typecheck, lint, format, tests)
        run: npm run check

      - name: Rust tests (SQLite, secrets)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build frontend
        run: npm run build

      - name: Build desktop app
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: live-studio-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error

      # Windows: the single exe that runs by itself (needs the WebView2 runtime, already part of
      # Windows 10/11), next to the installer.
      - name: Collect the portable Windows exe
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p release-exe
          cp "src-tauri/target/${{ matrix.target }}/release/live-studio.exe" release-exe/LIVE-STUDIO.exe
          cp src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe release-exe/ || true

      - name: Upload Windows exe
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: LIVE-STUDIO-windows-exe
          path: release-exe/*
          if-no-files-found: error

      # Every green build of main publishes a release (tag build-<run number>) with the Windows
      # exe and installer, so the newest version is always on the Releases page. A v* tag also
      # publishes, under its own name.
      - name: Publish release
        if: matrix.os == 'windows-latest' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('LIVE STUDIO build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.head_commit.message }}
          make_latest: true
          files: release-exe/*
