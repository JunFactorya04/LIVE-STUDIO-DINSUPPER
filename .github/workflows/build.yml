name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Run by hand from the Actions tab (or the API) to build only one platform.
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which builds: both, mac or windows"
        type: choice
        options: [both, mac, windows]
        default: both

permissions:
  contents: write

jobs:
  # Which platforms this run builds: both, unless a manual run asked for one.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        shell: bash
        run: |
          p="${{ github.event.inputs.platforms || 'both' }}"
          mac='{"os":"macos-latest","target":"universal-apple-darwin"}'
          win='{"os":"windows-latest","target":"x86_64-pc-windows-msvc"}'
          case "$p" in
            mac) inc="[$mac]" ;;
            windows) inc="[$win]" ;;
            *) inc="[$mac,$win]" ;;
          esac
          echo "matrix={\"include\":$inc}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
      # The two platforms (see plan above):
      # - macOS: universal-apple-darwin. GitHub no longer runs hosted macOS builds on real
      #   Intel hardware; every macOS runner is Apple Silicon, so "for Intel" means
      #   cross-compiling, and a plain cross-compiled x86_64 binary came out unsigned and was
      #   refused by real Intel Macs. A universal build compiles both architectures and
      #   lipo-merges them into one signed binary in the same `tauri build` step.
      # - Windows: x86_64-pc-windows-msvc.
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # A universal build needs both Apple Silicon and Intel std libs on the one (arm64)
          # runner; Cargo picks the right one per `--target` passed to `tauri build` below.
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: npm ci

      - name: Check (typecheck, lint, format, tests)
        run: npm run check

      - name: Rust tests (SQLite, secrets)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build frontend
        run: npm run build

      - name: Build desktop app
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: live-studio-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error

      # Windows: the single exe that runs by itself (needs the WebView2 runtime, already part of
      # Windows 10/11), next to the installer.
      - name: Collect the portable Windows exe
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p release-files
          cp "src-tauri/target/${{ matrix.target }}/release/live-studio.exe" release-files/LIVE-STUDIO.exe
          cp src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe release-files/ || true

      # macOS: one universal .dmg that opens on both Apple Silicon and Intel Macs.
      - name: Collect the macOS dmg
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release-files
          src="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          dmg=$(ls "$src"/*.dmg | head -n1)
          cp "$dmg" "release-files/LIVE-STUDIO-macOS.dmg"

      - name: Upload release files
        if: matrix.os == 'windows-latest' || runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: LIVE-STUDIO-release-${{ matrix.target }}
          path: release-files/*
          if-no-files-found: error

  # Every green push to main publishes one release (tag build-<run number>) carrying the Windows
  # exe/installer and both macOS dmg files, so the newest version of every platform is always on
  # the Releases page. A v* tag also publishes, under its own name. One job (not one per build
  # matrix entry) so the release is created exactly once instead of racing.
  release:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          pattern: LIVE-STUDIO-release-*
          path: release-files
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('LIVE STUDIO build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.head_commit.message || format('Build of {0} ({1})', github.sha, github.event.inputs.platforms) }}
          make_latest: true
          files: release-files/*
